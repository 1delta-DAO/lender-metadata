name: update-dataset

on:
    workflow_dispatch: # manual run
    schedule:
        - cron: "0 2 * * *" # optional nightly job

permissions:
    contents: write # allow pushing a branch
    pull-requests: write # allow creating a PR

jobs:
    run:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  # Prefer a PAT if configured; otherwise fall back to the
                  # built-in GITHUB_TOKEN so checkout/push still work when GH_PAT
                  # is missing or expired.
                  token: ${{ secrets.GH_PAT || github.token }}

            - uses: actions/setup-node@v5
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm ci

            - name: Build and run update script
              env:
                  UPSTREAM_URL: ${{ secrets.UPSTREAM_URL }} # set this in repo secrets
              run: |
                  npm run build
                  npm run update:dataset

            - name: Compute branch name
              id: vars
              run: echo "BRANCH_NAME=update-dataset-$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

            - name: Commit & push if changed
              id: commit
              env:
                  BRANCH_NAME: ${{ env.BRANCH_NAME }}
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

                    # Stage generated data + config (the Morpho updater writes
                    # labels/vaults under data/ and markets/pools under config/).
                    git checkout -b "$BRANCH_NAME"
                    git add data config
                    git commit -m "chore(data): update $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
                    git push origin "$BRANCH_NAME"
                    echo "Pushed branch: $BRANCH_NAME"
                    echo "has_changes=true" >> $GITHUB_OUTPUT
                  else
                    echo "No changes."
                    echo "has_changes=false" >> $GITHUB_OUTPUT
                  fi

            - name: Create Pull Request
              if: steps.commit.outputs.has_changes == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
                  BRANCH_NAME: ${{ env.BRANCH_NAME }}
              run: |
                  gh pr create \
                    --title "chore(data): update dataset" \
                    --body "Automated dataset update

                  This PR was created automatically by the update-dataset workflow.

                  Branch: $BRANCH_NAME" \
                    --base main \
                    --head "$BRANCH_NAME"
